# rslidar_sdk config for TWO RoboSense Airy lidars (live monitor test).
#   airy1 = 192.168.77.201  ports msop 6700 / difop 7789 / imu 6689
#   airy2 = 192.168.77.200  ports msop 6699 / difop 7788 / imu 6688
# Both send to host 192.168.77.191 (set in each lidar's web page).
common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6700
      difop_port: 7789
      imu_port: 6689
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.1
      max_distance: 200
      use_lidar_clock: false
      dense_points: false
      ts_first_point: true
      start_angle: 0
      end_angle: 360
    ros:
      ros_frame_id: airy1
      ros_recv_packet_topic: /airy1/packets
      ros_send_packet_topic: /airy1/packets
      ros_send_imu_data_topic: /airy1/imu
      ros_send_point_cloud_topic: /airy1/points
      ros_queue_length: 100
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699
      difop_port: 7788
      imu_port: 6688
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.1
      max_distance: 200
      use_lidar_clock: false
      dense_points: false
      ts_first_point: true
      start_angle: 0
      end_angle: 360
    ros:
      ros_frame_id: airy2
      ros_recv_packet_topic: /airy2/packets
      ros_send_packet_topic: /airy2/packets
      ros_send_imu_data_topic: /airy2/imu
      ros_send_point_cloud_topic: /airy2/points
      ros_queue_length: 100
